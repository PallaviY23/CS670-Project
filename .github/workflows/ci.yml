name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Generating a Powers of Tau file is the slowest step; reuse it between runs.
      - name: Cache Powers of Tau
        uses: actions/cache@v4
        with:
          path: build/ptau
          key: ptau-${{ runner.os }}-v1

      - run: npm ci

      - name: Circuit, prover, input and wallet tests
        run: npm test

      - name: Trusted setup and manifest
        run: npm run setup:demo

      - name: Web build
        run: npm run build

      - name: Prover benchmark (smoke)
        run: node scripts/bench.mjs --runs 5 --warmup 1

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: build/bench/*.csv
          if-no-files-found: ignore
